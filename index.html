<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-32x32.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layma Global Trading & Services</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var h = params.get('h') || '';
          window.history.replaceState(null, null, decodeURIComponent(p) + decodeURIComponent(h));
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
